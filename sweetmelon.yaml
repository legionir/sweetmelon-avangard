# AvanGard: a client for the w2ray WebSocket tunnel, built on Sweetmelon.
# Release of the Sweetmelon core this app is built for. Change it on purpose
# (sweetmelon upgrade), after reading the core CHANGELOG.
core: "2.7"

project:
  name: avangard
  display_name: "AvanGard"
  version: 1.0.0
  application_id: ir.legion.avangard
  dart_package: avangard
  icon: icon.png

# auto: plugins the JavaScript calls are on, the rest are off. The code reaches
# plugins through helpers, so the list below is explicit.
plugin_selection:
  mode: auto
  include:
    - w2ray_tunnel
    - storage
    - secure_storage
    - clipboard
    - share
    - haptic
    - permission
    - back_button
    - status_bar
    - safe_area
  exclude: []

plugins: {}
